  #gl{position:absolute;inset:0}
  .glmk{padding:6px;cursor:pointer;background:none;border:none}
  .glmk span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 12px/1 var(--body);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);text-shadow:0 0 2px rgba(0,0,0,.45);transition:transform .12s}
  .glmk.dot span{width:15px;height:15px}
  .glmk.hotel span{border-radius:6px;width:24px;height:24px}
  .glmk.on span{transform:scale(1.3);border-color:var(--ink)}
  .glmk.done span{opacity:.55}
  .maplibregl-popup-content{background:var(--surface);color:var(--ink);border-radius:3px;padding:.6rem .75rem;font:14px/1.4 var(--body);box-shadow:0 2px 10px rgba(0,0,0,.3);display:grid;gap:.2rem;max-width:15rem}
  .maplibregl-popup-tip{border-top-color:var(--surface)!important;border-bottom-color:var(--surface)!important}
  .maplibregl-popup-close-button{font-size:1.2rem;width:1.8rem;height:1.8rem;color:var(--ink-soft)}
  .pop-n{font-weight:650;padding-right:1.2rem}
  .pop-m{font-size:.78rem;color:var(--ink-soft)}
  .pop-a{display:flex;gap:.8rem;margin-top:.2rem;font-size:.85rem;font-weight:600}
  .pop-a a,.pop-a button{color:var(--accent);text-decoration:none}
  .maplibregl-ctrl-attrib{font-size:.62rem}
  .maplabel{position:absolute;left:.5rem;bottom:.45rem;font-size:.68rem;color:var(--ink-soft);background:var(--surface);padding:.1rem .4rem;border-radius:3px;opacity:.9;pointer-events:none}

  .dayhead{display:grid;gap:.35rem}
  .dayhead h2{margin:0;font:400 1.55rem/1.15 var(--display);text-wrap:balance}
  .stats{font-size:.85rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .go{display:flex;justify-content:center;align-items:center;gap:.4rem;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:650;border-radius:3px;padding:.8rem 1rem;min-height:44px}

  .stops{display:grid;border-top:1px solid var(--rule)}
  .stop{display:grid;grid-template-columns:2rem 1fr 2.6rem;gap:.15rem .7rem;padding:.8rem 0;border-bottom:1px solid var(--rule);align-items:start}
  .stop.on{background:var(--accent-soft);margin:0 -.5rem;padding-left:.5rem;padding-right:.5rem}
  .num{width:1.75rem;height:1.75rem;border-radius:50%;background:var(--ink);color:#fff;text-shadow:0 0 2px rgba(0,0,0,.45);display:grid;place-items:center;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:.1rem}
  .key{display:flex;flex-wrap:wrap;gap:.3rem .8rem;font-size:.75rem;color:var(--ink-soft);margin-top:-.4rem}
  .key span{display:inline-flex;align-items:center;gap:.35rem}
  .key i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .stop a.body{color:inherit;text-decoration:none;min-width:0;display:grid;gap:.1rem}
  .sname{font-weight:650;font-size:1.02rem;overflow-wrap:anywhere}
  .sname::after{content:" ↗";color:var(--accent);font-weight:400}
  .smeta{font-size:.78rem;color:var(--ink-soft);display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
  .smeta i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .time{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
  .snote{font-size:.88rem;color:var(--ink-soft)}
  .leg{grid-column:2 / 4;font-size:.72rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;order:-1;padding-bottom:.15rem}
  .tick{width:2.4rem;height:2.4rem;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;color:transparent;font-size:1rem}
  .tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .stop.done .sname{text-decoration:line-through;text-decoration-color:var(--ink-soft)}
  .hotel-row{display:grid;grid-template-columns:2rem 1fr;gap:.7rem;padding:.7rem 0;border-bottom:1px solid var(--rule);align-items:center}
  .hotel-row .go{grid-column:1 / -1}
  .hotel-row .body{color:inherit;text-decoration:none;display:grid;gap:.05rem;min-width:0}
  .hb{width:1.75rem;height:1.75rem;border-radius:5px;color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:800}
  .stop.done .num{background:var(--ink-soft)!important}

  .chips{display:flex;flex-wrap:wrap;gap:.35rem}
  .chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--rule);border-radius:999px;padding:.25rem .7rem;font-size:.8rem;color:var(--ink-soft);min-height:32px}
  .chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface)}
  .chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .group h3{margin:.4rem 0 .2rem;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:650}
  .plist a{display:grid;grid-template-columns:10px 1fr;gap:.1rem .65rem;padding:.65rem 0;border-bottom:1px solid var(--rule);color:inherit;text-decoration:none}
  .plist a .dot{width:10px;height:10px;border-radius:50%;margin-top:.4rem}

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function unlock(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(LOCK.salt), iterations: LOCK.iter, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(LOCK.iv)}, key, b64(LOCK.ct)));
  }
  const lock = document.getElementById('lock');
  function run(code) { lock.remove(); const s = document.createElement('script'); s.textContent = code; document.body.append(s); }
  const keep = (() => { try { return localStorage.getItem('trip.pass'); } catch { return null; } })();
  (keep ? unlock(keep).then(run) : Promise.reject()).catch(() => {
    lock.hidden = false;
    document.getElementById('lockPw').focus();
    document.getElementById('lockForm').addEventListener('submit', async e => {
      e.preventDefault();
      const pw = document.getElementById('lockPw').value.trim(), err = document.getElementById('lockErr');
      err.hidden = true;
      try {
        const code = await unlock(pw);
        try { document.getElementById('lockKeep').checked ? localStorage.setItem('trip.pass', pw) : localStorage.removeItem('trip.pass'); } catch {}
        run(code);
      } catch { err.hidden = false; }
    });
  });
})();
